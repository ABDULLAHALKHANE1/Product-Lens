name: product_lens
description: A clean Flutter product catalogue powered by the DummyJSON API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.2
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  http: ^1.6.0
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
